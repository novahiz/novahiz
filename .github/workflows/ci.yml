name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run tests
        run: node --test
      - name: Installer dry-run
        run: node install/install.mjs --dry-run --home "${{ github.workspace }}/.ci-home"
      - name: Run check
        run: node src/cli.ts check
        env:
          NOVAHIZ_HOME: ${{ github.workspace }}
