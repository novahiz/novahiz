name: Bug report
description: Report a defect in Skillenforce
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to file a bug.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The observed behavior and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact commands, the prompt, or the file path involved.
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node version
      placeholder: "node --version"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11, macOS 15, Ubuntu 24.04"
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Relevant output
      description: Paste the CLI JSON output or the error. Remove secrets first.
    validations:
      required: false
